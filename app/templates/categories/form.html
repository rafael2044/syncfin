{% extends "base.html" %}
{% block title %}SyncFin - {% if edit_category %}Editar{% else %}Nova{% endif %} Categoria{% endblock %}
{% block content %}
<h1 class="text-xl font-bold text-gray-900 mb-6">{% if edit_category %}Editar Categoria{% else %}Nova Categoria{% endif %}</h1>
{% if error %}
<div class="bg-red-50 text-red-700 text-sm font-medium px-4 py-3 rounded-lg border border-red-200 mb-4">{{ error }}</div>
{% endif %}
<form method="POST" action="{% if edit_category %}/categories/{{ edit_category.id }}/edit{% else %}/categories/new{% endif %}" class="bg-white rounded-xl border border-gray-200 p-6 max-w-3xl">
    <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">Nome</label>
        <input type="text" name="name" value="{{ edit_category.name if edit_category else '' }}" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
    </div>
    <div class="flex gap-2 mt-6 pt-4 border-t border-gray-200">
        <a href="/categories" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition">Cancelar</a>
        <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-primary-600 rounded-lg hover:bg-primary-700 transition">Salvar</button>
    </div>
</form>
{% endblock %}
