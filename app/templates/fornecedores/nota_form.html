{% extends "base.html" %}
{% block title %}SyncFin - Nova Nota Fiscal{% endblock %}
{% block content %}
<h1 class="text-xl font-bold text-gray-900 mb-6">Nova Nota Fiscal</h1>

<p class="text-sm text-gray-500 mb-4">Fornecedor: <span class="font-semibold text-gray-700">{{ fornecedor.name }}</span></p>

<form method="POST" action="/fornecedores/{{ fornecedor.id }}/notas/new" enctype="multipart/form-data" class="bg-white rounded-xl border border-gray-200 p-6 max-w-3xl">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">CNPJ do Fornecedor</label>
            <select name="fornecedor_cnpj" id="fornecedor_cnpj" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                <option value="">Selecione</option>
                {% for c in fornecedor.cnpjs %}
                <option value="{{ c.cnpj }}">{{ c.cnpj }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Número da Nota</label>
            <input type="text" name="numero" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
        </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Empresa Destinatária</label>
            <select name="empresa_id" id="empresa_select" required onchange="updateEmpresaCnpj()" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                <option value="">Selecione</option>
                {% for e in empresas %}
                <option value="{{ e.id }}" data-cnpj="{{ e.cnpj }}">{{ e.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">CNPJ da Empresa</label>
            <input type="text" name="empresa_cnpj" id="empresa_cnpj" readonly class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-gray-50 focus:outline-none">
        </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Material</label>
            <select name="tipo_material_id" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                <option value="">Selecione</option>
                {% for t in tipos %}
                <option value="{{ t.id }}">{{ t.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Data de Emissão</label>
            <input type="date" name="data_emissao" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
        </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Valor Total (R$)</label>
            <input type="number" name="valor_total" step="0.01" min="0" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Descrição</label>
            <input type="text" name="descricao" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
        </div>
    </div>

    <div class="border-t border-gray-200 pt-4 mt-4">
        <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3">Anexo da Nota Fiscal</h3>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Adicionar Anexo (PDF ou Imagem)</label>
            <input type="file" name="anexo" accept="image/*,.pdf" class="w-full px-3 py-2 border border-dashed border-gray-300 rounded-lg text-sm bg-gray-50 hover:border-primary-400 hover:bg-primary-50 transition cursor-pointer file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-primary-600 file:text-white file:cursor-pointer file:hover:bg-primary-700">
            <p class="text-xs text-gray-400 mt-1">Opcional. Formatos aceitos: JPG, PNG, GIF, PDF</p>
        </div>
    </div>

    <div class="flex gap-2 mt-6 pt-4 border-t border-gray-200">
        <a href="/fornecedores/{{ fornecedor.id }}" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition">Cancelar</a>
        <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-primary-600 rounded-lg hover:bg-primary-700 transition">Salvar</button>
    </div>
</form>

<script>
function updateEmpresaCnpj() {
    var select = document.getElementById('empresa_select');
    var option = select.options[select.selectedIndex];
    var cnpj = option.getAttribute('data-cnpj') || '';
    document.getElementById('empresa_cnpj').value = cnpj;
}
</script>
{% endblock %}
