<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncFin - Redefinir Senha</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center px-6">
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-black/30 backdrop-blur-sm z-[200] flex items-center justify-center hidden">
        <div class="bg-white rounded-2xl shadow-2xl px-8 py-6 flex items-center gap-4">
            <svg class="w-8 h-8 text-primary-600 animate-spin" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span id="loadingText" class="text-gray-700 font-medium text-sm">Carregando...</span>
        </div>
    </div>
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <img src="/static/logo.png" alt="SyncFin" class="h-12 object-contain mx-auto mb-4">
            <h1 class="text-2xl font-bold text-gray-900">Redefinir Senha</h1>
            <p class="text-sm text-gray-500 mt-2">Cole o token e defina sua nova senha</p>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
            {% if error %}
            <div class="flex items-center gap-3 bg-red-50 text-red-700 text-sm px-4 py-3 rounded-xl border border-red-200 mb-6">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/auth/reset-password">
                <input type="hidden" name="token" value="{{ token }}">

                <div class="mb-4">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Nova Senha</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        </div>
                        <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required minlength="6" class="w-full pl-11 pr-4 py-3 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 transition placeholder-gray-400">
                    </div>
                </div>

                <div class="mb-6">
                    <label for="password_confirm" class="block text-sm font-medium text-gray-700 mb-2">Confirmar Senha</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                        </div>
                        <input type="password" id="password_confirm" name="password_confirm" placeholder="Repita a senha" required minlength="6" class="w-full pl-11 pr-4 py-3 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 transition placeholder-gray-400">
                    </div>
                </div>

                <button type="submit" class="w-full bg-primary-600 hover:bg-primary-700 text-white font-semibold py-3 px-4 rounded-xl transition text-sm">
                    Redefinir Senha
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="/login" class="text-sm text-primary-600 hover:text-primary-700 font-medium">Voltar para o login</a>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('form').forEach(function(form) {
            form.addEventListener('submit', function() {
                var textEl = document.getElementById('loadingText');
                if (textEl) textEl.textContent = 'Redefinindo senha...';
                document.getElementById('loadingOverlay').classList.remove('hidden');
            });
        });
    });
    </script>
</body>
</html>
